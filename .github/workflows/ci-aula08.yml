name: CI — TechNova Aula 08

on:
  push:
    branches: [main]
    paths:
      - 'aula-08/**'
      - '.github/workflows/ci-aula08.yml'
  pull_request:
    branches: [main]
    paths:
      - 'aula-08/**'

concurrency:
  group: ci-aula08-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula-08
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aula-08/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

  test:
    name: 🧪 Testes (Jest + Coverage)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: aula-08
    env:
      APP_ENV: ${{ secrets.APP_ENV }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aula-08/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com coverage
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: aula-08/coverage/
          retention-days: 7

  build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: aula-08
    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: |
          docker build -t technova-api:${{ github.sha }} .
          echo "Imagem construída: technova-api:${{ github.sha }}"

      - name: Smoke test do container
        run: |
          docker run -d --name technova-smoke -p 3001:3000 technova-api:${{ github.sha }}
          sleep 3
          curl -f http://localhost:3001/health
          docker stop technova-smoke
          docker rm technova-smoke
