name: 🚀 CD Pipeline — TechNova Aula 10

on:
  push:
    branches: [main]
    paths:
      - 'aula-10/technova-api/**'
      - '.github/workflows/cd.yml'

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula-10/technova-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aula-10/technova-api/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: aula-10/technova-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aula-10/technova-api/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-aula10
          path: aula-10/technova-api/coverage/
          retention-days: 7

  build-push:
    name: 🐳 Build + Push ECR
    runs-on: ubuntu-latest
    needs: [lint, test]
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e Push
        id: build
        run: |
          REGISTRY=${{ steps.ecr.outputs.registry }}
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE="$REGISTRY/technova-api:sha-$SHA"
          docker build -t "$IMAGE" -t "$REGISTRY/technova-api:latest" aula-10/technova-api/
          docker push "$IMAGE"
          docker push "$REGISTRY/technova-api:latest"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "✅ Push: $IMAGE"

  deploy:
    name: 🚀 Deploy EC2
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
            IMAGE="$REGISTRY/technova-api:latest"
            SHA="${{ github.sha }}"

            echo "🔑 Login no ECR..."
            aws ecr get-login-password --region us-east-1 \
              | docker login --username AWS --password-stdin "$REGISTRY"

            echo "📥 Pull da imagem..."
            docker pull "$IMAGE"

            echo "🔄 Recreate: stop → rm → run..."
            docker stop technova-api || true
            docker rm technova-api || true
            docker run -d \
              --name technova-api \
              -p 3000:3000 \
              --restart unless-stopped \
              -e APP_VERSION="$SHA" \
              "$IMAGE"

            echo "✅ Deploy concluído: $IMAGE"

      - name: Health Check pós-deploy
        run: |
          echo "⏳ Aguardando aplicação iniciar..."
          for i in $(seq 1 30); do
            if curl -sf http://${{ secrets.EC2_HOST }}:3000/health | grep -q '"status":"ok"'; then
              echo "✅ Health check passou na tentativa $i!"
              exit 0
            fi
            echo "Tentativa $i/30 — aguardando 5s..."
            sleep 5
          done
          echo "❌ Health check falhou após 30 tentativas"
          exit 1
